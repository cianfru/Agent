name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the Docker image's Python
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install (pinned, hash-checked)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Tests
        run: python -m pytest -q
      - name: Docker image builds
        run: docker build -q -t synth-ci .
